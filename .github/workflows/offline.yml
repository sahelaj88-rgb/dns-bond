name: Offline Linux packages
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['packaging/**', '.github/workflows/offline.yml']
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Build and verify offline packages
        shell: bash
        run: |
          set -euo pipefail
          mkdir upstream
          version=$(python3 -c 'from install_engine import VERSION; print(VERSION)')
          for arch in AMD64 ARM64; do
            for role in Client Server; do
              name="MasterDnsVPN_${role}_Linux_${arch}.zip"
              curl -fLsS --retry 3 "https://github.com/masterking32/MasterDnsVPN/releases/download/$version/$name" -o "upstream/$name"
            done
            python3 packaging/build.py "$arch" upstream dist
          done
          cd dist && sha256sum *.tar.gz > SHA256SUMS
      - name: Publish release for this commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="offline-${GITHUB_SHA:0:12}"
          if gh release view "$tag" >/dev/null 2>&1; then exit 0; fi
          gh release create "$tag" --target "$GITHUB_SHA" --title "DNS Bond offline Linux packages" --notes "Application and pinned MasterDnsVPN client/server. Installation guide inside each archive." dist/*
